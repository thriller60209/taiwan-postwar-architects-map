<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣戰後建築師地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Leaflet core (inlined) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-container .leaflet-tile-pane img,.leaflet-container .leaflet-overlay-pane svg,.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container img.leaflet-tile{mix-blend-mode:normal}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:16px}.leaflet-bottom .leaflet-control{margin-bottom:12px}
.leaflet-left .leaflet-control{margin-left:16px}.leaflet-right .leaflet-control{margin-right:16px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive{cursor:grabbing}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:18px}
.leaflet-popup-content-wrapper{text-align:left}
.leaflet-popup-content{margin:0;min-height:1px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:14px;height:14px;margin:-8px auto 0;pointer-events:auto;transform:rotate(45deg)}
.leaflet-popup-close-button{position:absolute;border:none;text-align:center;width:28px;height:28px;text-decoration:none;background:transparent;z-index:2}
.leaflet-tooltip{position:absolute;white-space:nowrap;-webkit-user-select:none;user-select:none;pointer-events:none}
.leaflet-control-attribution{margin:0!important;padding:0 6px;line-height:1.6}

/* ---------- Site — synced with atelier WooO database ---------- */
:root{
  --silver:#b4bebe; --silver-light:#d0d8d8; --silver-dark:#737c7c; --black:#000; --white:#fff;
  --silver-text:#b4bebe; --silver-title:#d0d8d8; --silver-muted:#7f8888; --rule:rgba(180,190,190,.5); --rule-soft:rgba(180,190,190,.28);
  --font:"Source Code Pro","Microsoft JhengHei","Noto Sans TC",Arial,monospace,sans-serif;
  --side:380px; --head:69px; --cursor-x:-100vw; --cursor-y:-100vh;
}
*{box-sizing:border-box}
html{background:var(--black);color:var(--silver-text);font-family:var(--font);font-size:10pt;letter-spacing:0}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--black);color:var(--silver-text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
a:hover,a:focus{text-decoration:underline}
::selection{background:var(--silver);color:var(--black)}

/* crosshair cursor (same as WooO database) */
.index-cursor{position:fixed;z-index:3000;pointer-events:none;opacity:0;transition:opacity .14s}
.index-cursor-x{left:0;right:0;top:var(--cursor-y);height:2px;background:rgba(180,190,190,.46)}
.index-cursor-y{top:0;bottom:0;left:var(--cursor-x);width:2px;background:rgba(180,190,190,.42)}
@media (hover:hover) and (pointer:fine){
  header,header *,aside,aside *{cursor:none!important}
  body:hover .index-cursor{opacity:1}
  #map,#map .leaflet-interactive{cursor:crosshair}
}

header{position:absolute;top:0;left:0;right:0;height:var(--head);padding:14px 18px 0;z-index:20;background:var(--black)}
.site-header{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;border-bottom:1px solid var(--rule);padding-bottom:12px;height:100%}
.brand{display:flex;align-items:center;gap:8px;font-size:10pt;line-height:1.2;color:var(--silver-text);text-decoration:none!important}
.brand img{width:58px;height:auto;display:block;flex:none}
.brand span{white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:14px;justify-content:flex-end;line-height:1.2;align-items:center}
.menu-btn{display:none;background:none;border:0;padding:0;cursor:pointer;color:var(--silver-text)}
.menu-btn:hover{text-decoration:underline}

main{position:absolute;top:var(--head);bottom:0;left:0;right:0;display:flex;padding:18px 18px 0;gap:18px}
aside{width:var(--side);flex:none;background:var(--black);display:flex;flex-direction:column;min-height:0;z-index:10}
#map{flex:1;min-width:0;background:#0b0c0c;margin-bottom:18px;border:1px solid var(--rule)}

.page-title{margin:0 0 18px;font-size:10pt;font-weight:700;line-height:1.4;color:var(--silver-title)}
.search{padding:0 0 14px;border-bottom:1px solid var(--rule)}
.search label{display:block;font-size:10pt;font-weight:700;color:var(--silver-title);margin-bottom:10px;line-height:1.4}
.sbox{position:relative}
.sbox input{width:100%;font-size:10pt;line-height:1.45;padding:6px 26px 6px 0;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--silver-title);outline:none;border-radius:0;-webkit-appearance:none;appearance:none}
.sbox input:focus{border-bottom-color:var(--silver)}
.sbox input::placeholder{color:var(--silver-muted)}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sbox .x{position:absolute;right:0;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:none;font-size:14px;cursor:pointer;display:none;color:var(--silver-text);padding:0}
.sbox.has .x{display:block}
.hint{font-size:10px;color:var(--silver-muted);margin-top:10px;line-height:1.6}
.stat{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;line-height:1.45}
.stat .num{font-size:10pt;color:var(--silver-title)}
.stat .num small{font-size:10px;color:var(--silver-muted);margin-left:6px}
.clear{font-size:10px;border:0;background:none;padding:0;cursor:pointer;color:var(--silver-text)}
.clear:hover{text-decoration:underline}
.clear[hidden]{display:none}

.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--silver-dark) transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--silver-dark)}
.sec-h{position:sticky;top:0;background:var(--black);z-index:2;display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;border-bottom:1px solid var(--rule);font-size:10pt;font-weight:700;color:var(--silver-title);line-height:1.45}
.sec-h span:last-child{font-weight:400;color:var(--silver-muted);font-size:10px}

.results[hidden]{display:none}
.res-list{list-style:none;margin:0;padding:0;max-height:36vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--silver-dark) transparent;border-bottom:1px solid var(--rule)}
.more{font-size:10px;color:var(--silver-muted);padding:6px 0;line-height:1.6}
.more a{color:var(--silver-text);text-decoration:underline}

.arch{border-bottom:1px solid var(--rule)}
.arch-row{display:flex;align-items:center;padding:5px 0 6px;line-height:1.45;cursor:pointer;user-select:none}
.arch-row:hover .arch-name{text-decoration:underline}
.chk{width:9px;height:9px;border:1px solid var(--c);flex:none;margin-right:12px;background:transparent}
.arch.on .chk{background:var(--c)}
.arch-name{flex:1;font-size:10pt;color:var(--silver-text)}
.arch.on .arch-name{color:var(--silver-title);font-weight:700}
.arch-name .cnt{font-weight:400;color:var(--silver-muted)}
.badge{font-size:10px;color:var(--silver-title);margin-right:10px}
.badge[hidden]{display:none}
.arch.dim .arch-row{opacity:.22}
.tog{width:22px;height:22px;border:none;background:none;cursor:pointer;flex:none;color:var(--silver-text);font-size:12px;padding:0;line-height:1}
.tog::before{content:"+"}
.arch.open .tog::before{content:"−"}
.works{list-style:none;margin:0;padding:0 0 8px;display:none}
.arch.open .works{display:block}

.work{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:4px 0 4px 21px;font-size:12px;line-height:1.5;cursor:pointer;color:var(--silver-text)}
.res-list .work{grid-template-columns:9px 40px 1fr;padding-left:0;border-bottom:1px solid var(--rule-soft);padding-top:5px;padding-bottom:6px;font-size:10pt;color:var(--silver-text);line-height:1.45}
.work:hover{color:var(--silver-title)}
.work:hover span:last-child{text-decoration:underline}
.work .yr{font-size:11px;color:var(--silver-muted);padding-top:1px;font-variant-numeric:tabular-nums}
.res-list .work .yr{font-size:11px}
.work .dot{width:9px;height:9px;margin-top:4px;background:var(--c)}

aside footer{padding:12px 0 14px;font-size:10px;line-height:1.6;color:var(--silver-text);border-top:1px solid var(--rule)}
.contact{display:grid;grid-template-columns:22px 1fr}
.contact .ck{color:var(--silver-muted)}

/* popup */
.leaflet-popup-content-wrapper{background:var(--black);color:var(--silver-text);border:1px solid var(--rule);border-radius:0;box-shadow:none}
.leaflet-popup-tip{background:var(--black);border:1px solid var(--rule);box-shadow:none}
.leaflet-popup-close-button{color:var(--silver-text)!important;font:16px/28px "Source Code Pro",monospace!important;top:8px!important;right:8px!important}
.pp{width:340px;max-width:72vw;font-family:var(--font)}
.pp-top{padding:16px 40px 12px 16px;border-bottom:1px solid var(--rule)}
.pp-yr{font-size:9px;color:var(--silver-muted);margin-bottom:6px}
.pp h3{margin:0;font-size:10pt;line-height:1.4;font-weight:700;color:var(--silver-title)}
.pp-arch{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.chip{font-size:10px;color:var(--silver-text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.6}
.chip::before{content:"";width:9px;height:9px;background:var(--c);display:inline-block}
.chip:hover{text-decoration:underline}
.pp-body{padding:12px 16px 14px;max-height:260px;overflow-y:auto;font-size:10pt;line-height:1.75;color:var(--silver-text);word-break:break-word;scrollbar-width:thin;scrollbar-color:var(--silver-dark) transparent}
.pp-body a{text-decoration:underline}
.pp-src{padding:8px 16px 12px;font-size:10px;color:var(--silver-muted);border-top:1px solid var(--rule);line-height:1.6}
.pp-coord{font-variant-numeric:tabular-nums}
.pp-gmap{display:block;padding:9px 16px 10px;border-top:1px solid var(--rule);font-size:10pt;color:var(--silver-title);line-height:1.45}
.pp-gmap:hover{background:var(--silver);color:var(--black);text-decoration:none}

.tip{background:var(--black);color:var(--silver-title);font-size:10px;padding:3px 7px;border:1px solid var(--rule);font-family:var(--font)}

/* map controls */
.zoom{display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--black)}
.zoom button{width:32px;height:32px;border:none;background:var(--black);font-size:12px;cursor:pointer;color:var(--silver-text);padding:0}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:hover{background:var(--silver);color:var(--black)}
.leaflet-control-attribution{font-family:var(--font)!important;font-size:9px!important;background:rgba(0,0,0,.75)!important;color:var(--silver-muted)!important}
.leaflet-control-attribution a{color:var(--silver-text)!important}
.basenote{background:rgba(0,0,0,.85);border:1px solid var(--rule);font-size:10px;padding:6px 9px;max-width:260px;line-height:1.6;color:var(--silver-muted)}
.basenote[hidden]{display:none}
.county-label{font-size:10px;letter-spacing:.2em;color:var(--silver-muted);white-space:nowrap}
.base-tiles{filter:grayscale(1) invert(1) brightness(.78) contrast(.95)}

@media (max-width: 760px){
  :root{--side:min(88vw,360px);--head:64px}
  header{padding:12px 12px 0}
  .brand img{width:48px}
  .menu-btn{display:inline-block}
  .nav{gap:14px}
  main{padding:12px 12px 0}
  aside{position:absolute;top:0;bottom:0;left:0;padding:12px;transform:translateX(-102%);transition:transform .25s;border-right:1px solid var(--rule)}
  body.side-open aside{transform:none}
  #map{margin-bottom:12px}
}
</style>
</head>

tSX031wmiehrvjwEYUg3cwK5g26O6WZuGLNjtKZimh6efK4U0lkBp2RP_uVf_Vz18uRB6-MEtyopOP5smHNExKr_8q3M_niVI9eu11OFo9zC9biV0Zsb0FuMGlg65Y9LvqI9NH_Voc30Ek?fife=s16383\">［原始圖片］<\/a><br><br>中山北路二段45巷39號<br><br>高而潘/基泰","s":["《基泰工程司 feat. 高而潘》／高而潘基泰時期（1957～1966）","《蓬萊異聞錄》／戰後建築"],"t":"中華基督教會公理堂1962 中華基督教會公理堂1962 中山北路二段45巷39號高而潘/基泰"},{"n":"胡適墓園1963","y":1963,"a":[36,38],"lat":25.039488,"lng":121.61806,"d":"胡適博士的靈柩，定今日上午安葬。昨天下午，斜風秋雨裏，還有幾個工人在那兒忙著墓園的整理工作。<br><br>胡適博士的墓園，在南港中央研究院門前的山坡兒上。那裏是青山環繞，環境清幽。用以作胡博士長眠安息之所，真是再合適也沒有了。<br><br>智德兼隆一大儒<br><br>從小山坡的兩邊拾級而上，約一百公尺，是一塊廣場，再爬上十六個梯階，就是墓園，四邊環圍著長廊，地面用卵石舖成。墓穴的前方上壁刻有總統輓弔的橫匾「智德兼隆」四個金字和上下款文。花崗石的墓碑鑲在墓穴的中間，上面是刻著于右任題的「中央研究院院長胡適先生墓」。在墓穴裏，還豎立一塊石刻的「墓誌銘」。上面是這樣寫的：「這是胡適先生的墓。<br><br>生於中華民國紀元前二十一年。<br><br>卒於中華民國五十一年。<br><br>這個為學術和文化的進步，為思想和言論的自由，為民族的尊榮，為人類的幸福而苦心焦思，敝精勞神以致身死的人，現在在這裡安息了！<br><br>我們相信，形骸終要化滅，陵谷也會變易，但現在墓中這位哲人所給予世界的光明，將永遠存在。<br><br>中央研究院胡故院長適之先生治喪委員會立石。<br><br>中華民國五十一年十月十五日。」<br><br>這篇白話文的「墓誌銘」，是胡博士生前好友毛子水教授所作，由王壯為書寫。<br><br>大家出力的故事<br><br>胡適博士是在今年二月二十四日去世，靈柩暫停在中央研究院的辦公廳裏。為了紀念這位偉大的學人，政府當局與胡先生的治喪委員會一並會同了胡夫人和有關方面，籌劃在南港中央研究院附近興建一座宏偉的墓園，以供後人憑弔。<br><br>說起籌建這座墓園的經過，真有不少動人的故事。凡是經手辦理這件事的人，莫不懷著崇高的敬意，不計報酬，不問代價，盡心盡力的要把它做得盡善盡美。這裏面有工程師、建築師、農民、商人和工人。墓園的建築是分兩期進行，第一期是墓地的建造，也就是在昨天完成的那一部份。第二期是墓園的進一步整理和美化。<br><br>在今年三月中旬，當大家選定中央研究院對面的那塊小山坡作為胡適博士的墓地後，地主李福人立即答應讓出一千坪土地，並表示計較代價。最後，以六十坪平地的土地，以及一萬元山林補償費，作為交換條件。在經濟價值上講，他是吃虧很大。第二步是墓園的設計，治喪委員會在多種設計圖樣裏，選定了基泰工程公司建築師高爾潘設計的藍圖。這一件工作，完全是義務，基泰公司和高先生都沒有拿一分錢報酬。<br><br>七月六日在台北開標，由洪文華營造廠得標，標價只有十二萬五千元，也等於是半盡義務。<br><br>黃老板的花崗石<br><br>至於墓碑選定，治喪委員會也費了一些腦筋。本省一般幕石大都是用台灣產的觀音石，考究一點的是用金門石。但是這些石碑都經不起風雨侵蝕，無法持久，因此有人建議最好採用花崗石，因為它是愈久愈經磨，能保千百年而不壞。但是，花崗石必須向國外採購，經費和時間都不允許。真巧！意外的在台北中崙附近找到了這塊林有的花崗石大石碑，它是碑石工廠黃明宗所有。據說是日據時代一個日本將軍備用的，台灣光復，那個日本人走了，留下來二十多年，真是「得來全不費工夫」。這塊價值數萬元的碑石，黃老板只拿了五千元，並且精工磨刻。<br><br>這個從七月間動工，花了三個月時間，到昨天才完成的第一期工程中，包括了胡博士和胡夫人未來的墓穴，以及墓地四週的建築。至於如何擴建和美化這個墓園，要等胡博士的靈柩在今天安葬以後，在第二期工程中去做。<br><br>這個人精神不死<br><br>第二期工程計劃和經費的籌措，大致是這樣決定的：北大同學會已募得十二萬元，預備在墓園的右面蓋幾個涼亭，並立一大璧碑，將胡博士的生平和成就，詳詳細細的刻在上面。另外中國公學同學會也募得五、六萬元，預備在墓園裏豎立一個銅像，並在幕園的下面正前方做一個噴水池。到那個時候，整個的墓園才算建築完成。<br><br>胡博士的靈柩今天要安葬了，一代學人，從此長眠黃土中。但是，他的思想、精神與學術上的貢獻，將流傳到永遠！而這一塊墓園也必然成為萬世景仰的勝地。<br><br>【1962-10-15/聯合報/02版/】<br><br>高而潘/基泰<br>凌德麟/公園景觀設計<br>建築雙月刊第3期","s":["《基泰工程司 feat. 高而潘》／高而潘基泰時期（1957～1966）","《蓬萊異聞錄》／宗教建築"],"t":"胡適墓園1963 胡適墓園1962 胡適博士的靈柩，定今日上午安葬。昨天下午，斜風秋雨裏，還有幾個工人在那兒忙著墓園的整理工作。胡適博士的墓園，在南港中央研究院門前的山坡兒上。那裏是青山環繞，環境清幽。用以作胡博士長眠安息之所，真是再合適也沒有了。智德兼隆一大儒從小山坡的兩邊拾級而上，約一百公尺，是一塊廣場，再爬上十六個梯階，就是墓園，四邊環圍著長廊，地面用卵石舖成。墓穴的前方上壁刻有總統輓弔的橫匾「智德兼隆」四個金字和上下款文。花崗石的墓碑鑲在墓穴的中間，上面是刻著于右任題的「中央研究院院長胡適先生墓」。在墓穴裏，還豎立一塊石刻的「墓誌銘」。上面是這樣寫的：「這是胡適先生的墓。生於中華民國紀元前二十一年。卒於中華民國五十一年。這個為學術和文化的進步，為思想和言論的自由，為民族的尊榮，為人類的幸福而苦心焦思，敝精勞神以致身死的人，現在在這裡安息了！我們相信，形骸終要化滅，陵谷也會變易，但現在墓中這位哲人所給予世界的光明，將永遠存在。中央研究院胡故院長適之先生治喪委員會立石。中華民國五十一年十月十五日。」這篇白話文的「墓誌銘」，是胡博士生前好友毛子水教授所作，由王壯為書寫。大家出力的故事胡適博士是在今年二月二十四日去世，靈柩暫停在中央研究院的辦公廳裏。為了紀念這位偉大的學人，政府當局與胡先生的治喪委員會一並會同了胡夫人和有關方面，籌劃在南港中央研究院附近興建一座宏偉的墓園，以供後人憑弔。說起籌建這座墓園的經過，真有不少動人的故事。凡是經手辦理這件事的人，莫不懷著崇高的敬意，不計報酬，不問代價，盡心盡力的要把它做得盡善盡美。這裏面有工程師、建築師、農民、商人和工人。墓園的建築是分兩期進行，第一期是墓地的建造，也就是在昨天完成的那一部份。第二期是墓園的進一步整理和美化。在今年三月中旬，當大家選定中央研究院對面的那塊小山坡作為胡適博士的墓地後，地主李福人立即答應讓出一千坪土地，並表示計較代價。最後，以六十坪平地的土地，以及一萬元山林補償費，作為交換條件。在經濟價值上講，他是吃虧很大。第二步是墓園的設計，治喪委員會在多種設計圖樣裏，選定了基泰工程公司建築師高爾潘設計的藍圖。這一件工作，完全是義務，基泰公司和高先生都沒有拿一分錢報酬。七月六日在台北開標，由洪文華營造廠得標，標價只有十二萬五千元，也等於是半盡義務。黃老板的花崗石至於墓碑選定，治喪委員會也費了一些腦筋。本省一般幕石大都是用台灣產的觀音石，考究一點的是用金門石。但是這些石碑都經不起風雨侵蝕，無法持久，因此有人建議最好採用花崗石，因為它是愈久愈經磨，能保千百年而不壞。但是，花崗石必須向國外採購，經費和時間都不允許。真巧！意外的在台北中崙附近找到了這塊林有的花崗石大石碑，它是碑石工廠黃明宗所有。據說是日據時代一個日本將軍備用的，台灣光復，那個日本人走了，留下來二十多年，真是「得來全不費工夫」。這塊價值數萬元的碑石，黃老板只拿了五千元，並且精工磨刻。這個從七月間動工，花了三個月時間，到昨天才完成的第一期工程中，包括了胡博士和胡夫人未來的墓穴，以及墓地四週的建築。至於如何擴建和美化這個墓園，要等胡博士的靈柩在今天安葬以後，在第二期工程中去做。這個人精神不死第二期工程計劃和經費的籌措，大致是這樣決定的：北大同學會已募得十二萬元，預備在墓園的右面蓋幾個涼亭，並立一大璧碑，將胡博士的生平和成就，詳詳細細的刻在上面。另外中國公學同學會也募得五、六萬元，預備在墓園裏豎立一個銅像，並在幕園的下面正前方做一個噴水池。到那個時候，整個的墓園才算建築完成。胡博士的靈柩今天要安葬了，一代學人，從此長眠黃土中。但是，他的思想、精神與學術上的貢獻，將流傳到永遠！而這一塊墓園也必然成為萬世景仰的勝地。【1962-10-15/聯合報/02版/】高而潘/基泰凌德麟/公園景觀設計建築雙月刊第3期"},{"n":"台大醫院精神病科大樓1964","y":1964,"a":[38],"lat":25.041085,"lng":121.517666,"d":"郭天來<br>並非高而潘(郭肇立親自詢問)<br>建築雙月刊第24期","s":["《基泰工程司 feat. 高而潘》／高而潘基泰時期（1957～1966）"],"t":"台大醫院精神病科大樓1964 郭天來並非高而潘(郭肇立親自詢問)建築雙月刊第 電子自動，操作簡便，並附有緊急安全設施，其他水電，消防等設施，均按有關當局之規定施工。<br><br>同時，該辦公大樓每層可代辦貸款五十萬元，第十一層尚可分割為小辦公廳單獨出售，歡迎各機關行號訂購。<br><br>大峰建設工程公司地址在台北市南京東路三段一八六號，電話七一六二三九號。<br><br>【1971-06-27/經濟日報/08版/】","s":["《蓬萊異聞錄》／戰後建築","《基泰工程司 feat. 高而潘》／自行開業"],"t":"大峰大樓1972 大峰大樓1972 高而潘大峰辦公大樓歡迎分層訂購【本報訊】座落在台北市南京東路三段二一四號角地的「大峰辦公大樓」，已局部完工，歡迎各機關行號分層訂購。大峰建設工程公司負責人蔡維修說：「大峰辦公大樓」，係該公司特聘高而潘建築師精心慎密設計的十一層豪華辦公大廈，式樣新穎，氣派不凡。地下室層設有停車場，地下餐廳、咖啡室及防空避難室等。同時，因該大樓位於南京東路角地，除面向南京東路外，側面有六公尺寬的巷道，上下班交通万便，光線及空氣俱佳。他說：該大樓係採鋼筋混凝土結構，設計精密，施工準確，並設有防颱、防震設備，堪稱安全堅固，一切施工標準，完全按工務局核發圖說施工。外墻外部貼馬席克，騎樓部份貼大理石，色澤美觀，地面舖瀝青地磚，色彩可任意選擇，正門採用豪華自動門，各辦公室正門為豪華鋁門，各層辦公室設有十rt水冷式冷氣機一部，大樓電梯採用日製豪華十人用自動電梯二台，式樣新，完全電子自動，操作簡便，並附有緊急安全設施，其他水電，消防等設施，均按有關當局之規定施工。同時，該辦公大樓每層可代辦貸款五十萬元，第十一層尚可分割為小辦公廳單獨出售，歡迎各機關行號訂購。大峰建設工程公司地址在台北市南京東路三段一八六號，電話七一六二三九號。【1971-06-27/經濟日報/08版/】"},{"n":"新光松江辦公大樓1972","y":1972,"a":[36],"lat":25.048542,"lng":121.533194,"d":"高而潘","s":["《蓬萊異聞錄》／戰後建築","《基泰工程司 feat. 高而潘》／自行開業"],"t":"新光松江辦公大樓1972 新光松江大樓1972 高而潘"},{"n":"市府公教住宅1972","y":1972,"a":[36],"lat":25.064684,"lng":121.564671,"d":"<a href=\"https://mymaps.usercontent.google.com/hostedimage/m/*/3ABkJAZhYh-noEy7r0knObl2djcw1inRRt29pN9Eiv_MBemsS49j1ePiVlxZILUloP-CwFMt1VBYPy6TCbnNZJG1pRKxNqXOmhAFZAWTkPeiEY8dcb7XKM-ORXlsdzuiAJ4pjcqU_lnMjme8oWIwxpT88vqG8nh7fHdgFBv_evIMt8Aj3ykVImDxcZneraLuVG8PJGkaFHv-Ofnrjjh8?fife=s16383\">［原始圖片］<\/a><br><br>","s":["《基泰工程司 feat. 高而潘》／自行開業"],"t":"市府公教住宅1972 "},{"n":"成功大樓集合住宅1972","y":1972,"a":[36],"lat":25.04842,"lng":121.540174,"d":"高而潘","s":["《蓬萊異聞錄》／戰後建築","《基泰工程司 feat. 高而潘》／自行開業"],"t":"成功大樓集合住宅1972 成功大樓住宅1972 高而潘"},{"n":"青林大廈(普)1974","y":1974,"a":[36],"lat":25.04396,"lng":121.522835,"d":"高而潘","s":["《蓬萊異聞錄》／戰後建築","《基泰工程司 feat. 高而潘》／自行開業"],"t":"青林大廈(普)1974 青林大廈1974 高而潘"},{"n":"今日醫業辦公大樓1973","y":1973,"a":[36],"lat":25.045122,"lng":121.512469,"d":"已拆除","s":["《基泰工程司 feat. 高而潘》／自行開業"],"t":"今日醫業辦公大樓1973 已拆除"},{"n":"裕民大廈1972","y":1972,"a":[22,23,36],"lat":25.033614,"lng":121.518126,"d":"高而潘<br>由國人斥資選擇在台北市中心地區羅斯福路一段口，興建之裕民商業辦公大樓，現已做好地基工程及第一二樓基礎工程，全部工程預定於明年二月底完成。本大樓由名建築師高而潘精心設計，並負費監造，其設計外型豪華美觀，格局新款，確溶合了建築與藝術於一爐，是高建築師最得意傑作。<br><br>高而潘說：裕民大廈早在一年前已設計完成，因業主為國內知名之士，他斥資興建裕民大廈的宗旨不在謀利，而在繁榮國內工商業，因此考慮再三，決定變更將原作公寓設計藍圖作了一次細部的修訂，改為作辦公室用途，以採用國內外最高級建材，並力求將成本降到最低限度，利潤分享客戶，事前工作已作了萬全準備，才著手動工興建，此大廈具有二大特色：(一)在設計上，以最新的構想，新的觀念，將樓梯及電梯設計於大廈最中心的位置，充分利用了空間，減少了走廊缺點，也發揮四週光線充足與空氣流通，並方便經常出入人員，只要走出辦公室就可乘梯，無須經過他人辦公室。(二)在設備上：採用日立牌原裝三部聯動式豪華電梯，其速度為每分鐘一五○公尺，另備有專運貨電梯一部，可載重九○○公斤。並採用日立牌冷水式空氣調節系統，每層獨立，各為一單位系統，另增設有自備發電機，決不受停電影響，每層並設有卅個自動電話單位，足夠使用，防火警報裝有自動報警系統，埋設地下層，種為安全。<br><br>【1971-03-04/經濟日報/08版/】<br><br><a href=\"https://mymaps.usercontent.google.com/hostedimage/m/*/3ABkJAZiOmaQpcmiS9YCsXxTiRpbIpSowNUQI8kvyTckdvdmVolKfPwcHra6qOrsooDt0HD25Txd8Qib1DS51AHIXuXlOjWvBxc93nlfgfiwWVzWb6ygRMlSwt_4DpxB9p-iiSVqZMmgD4pwXJOHn-Jy7ius_G013DARMQf5rpzsR-bWkF_md8YJ-on0ZYKF7YRQZ5YB2jq6GUVpfpUw?fife=s16383\">［原始圖片］<\/a><br><br>沈祖海+宗邁？","s":["《蓬萊異聞錄》／戰後建築","《基泰工程司 feat. 高而潘》／自行開業"],"t":"裕民大廈1972 裕民大廈1972 高而潘由國人斥資選擇在台北市中心地區羅斯福路一段口，興建之裕民商業辦公大樓，現已做好地基工程及第一二樓基礎工程，全部工程預定於明年二月底完成。本大樓由名建築師高而潘精心設計，並負費監造，其設計外型豪華美觀，格局新款，確溶合了建築與藝術於一爐，是高建築師最得意傑作。高而潘說：裕民大廈早在一年前已設計完成，因業主為國內知名之士，他斥資興建裕民大廈的宗旨不在謀利，而在繁榮國內工商業，因此考慮再三，決定變更將原作公寓設計藍圖作了一次細部的修訂，改為作辦公室用途，以採用國內外最高級建材，並力求將成本降到最低限度，利潤分享客戶，事前工作已作了萬全準備，才著手動工興建，此大廈具有二大特色：(一)在設計上，以最新的構想，新的觀念，將樓梯及電梯設計於大廈最中心的位置，充分利用了空間，減少了走廊缺點，也發揮四週光線充足與空氣流通，並方便經常出入人員，只要走出辦公室就可乘梯，無須經過他人辦公室。(二)在設備上：採用日立牌原裝三部聯動式豪華電梯，其速度為每分鐘一五○公尺，另備有專運貨電梯一部，可載重九○○公斤。並採用日立牌冷水式空氣調節系統，每層獨立，各為一單位系統，另增設有自備發電機，決不受停電影響，每層並設有卅個自動電話單位，足夠使用，防火警報裝有自動報警系統，埋設地下層，種為安全。【1971-03-04/經濟日報/08版/】沈祖海+宗邁？"},{"n":"欣欣大眾超級市場1972","y":1972,"a":[36,74],"lat":25.054144,"lng":121.525969,"d":"<a href=\"https://mymaps.usercontent.google.com/hostedimage/m/*/3ABkJAZhax2_4nZKhHBkc5FlXtj10FLYaBy7JhXCwqzpMAb6nq1pmewaFQwn_I4NbmclQTypVpMEmvK3tPMLrQu1efQDkYkb8I1fHnp_UYttuCtVVchfagFMb72gOv-9c12cOygvp4mJK6W5yHNhTf1uYZN-u7Wi-oBBKNwFiFYQYbDx-0jxAjpy3rOqIzOSxitGAn9OOiQQ9OyIq1IM?fife=s16383\">［原始圖片］<\/a><br><br>蔡伯峰+高而潘+阮發(泰平)<br>競潮營造廠","s":["《基泰工程司 feat. 高而潘》／自行開業","《蓬萊異聞錄》／戰後建築"],"t":"欣欣大眾超級市場1972 欣欣大眾市場(普)1972 蔡伯峰+高而潘+阮發(泰平)競潮營造廠高而潘"},{"n":"國泰景園大廈(普)1973","y":1973," 建築工程為鋼筋混凝土架構磚造五樓連棟環型中間走廊式建築物，計五七九戶，除第一樓供作商店外，並開地下層二千二百坪為菜市場，可以容納三二二攤位；此外尚有停車場，對於繁榮該地區商業，具有經濟價值。該批住宅的面積分為甲、乙、丙三種，每戶均有獨用之廚房、廁所、浴室等衛生設備，各種住宅面積及其戶數分配如左：（一）一樓店面計一四七戶，每戶六．八○坪（不包括騎樓）。（二）二－五樓甲種住宅六四戶，每戶一二．五坪。（三）二－五樓乙種住宅一三二戶，每戶一○．五坪。（四）二－五樓丙種住宅二三六戶，每戶八．五坪。市政府說，該工程總計工程費四千一百五十萬元。【1968-08-16/聯合報/10版/】"},{"n":"南機場三期1972/05/14","y":1972,"a":[1,25,65],"lat":25.029798,"lng":121.50468,"d":"有巢(虞曰鎮)、利眾(林柏年)、德聯(張敏德)、中國興業(顧授書)","s":["《蓬萊異聞錄》／戰後建築"],"t":"南機場三期1972/05/14 有巢(虞曰鎮)、利眾(林柏年)、德聯(張敏德)、中國興業(顧授書)"},{"n":"中國美生總會1970","y":1970,"a":[65],"lat":25.049222,"lng":121.543322,"d":"1970/08/20 蔣緯國 白克德發起完工<br>虞曰鎮/有巢建築師事務所設計<br>建築雙月刊第7期","s":["《蓬萊異聞錄》／戰後建築"],"t":"中國美生總會1970 1970/08/20蔣緯國白克德發起完工虞曰鎮/有巢建築師事務所設計建築雙月刊第7期"},{"n":"王大閎建國南路重建2014","y":2014,"a":[3,23],"lat":25.071264,"lng":121.524106,"d":"宗邁重建<br><br>蘇喻哲","s":["《台博GIS》／王大閎","《蓬萊異聞錄》／戰後建築"],"t":"王大閎建國南路重建2014 王大閎建國南路重建 宗邁重建蘇喻哲"},{"n":"新聞一邨","y":null,"a":[48],"lat":22.6444,"lng":120.300963,"d":"陳仁和<br><br>陳仁和<br>小樑<br>扁樑","s":["《台博GIS》／陳仁和","《蓬萊異聞錄》／戰後建築"],"t":"新聞一邨 新聞一邨1969 陳仁和陳仁和小樑扁樑"},{"n":"端容眼科診所1960","y":1960,"a":[64,79],"lat":24.138269,"lng":120.681072,"d":"顏水龍+楊貽炳","s":["《蓬萊異聞錄》／戰後建築"],"t":"端容眼科診所1960 顏水龍+楊貽炳"},{"n":"廣成產業股份有限公司","y":null,"a":[4],"lat":23.944374,"lng":120.565253,"d":"王水河字體","s":["《蓬萊異聞錄》／戰後建築"],"t":"廣成產業股份有限公司 王水河字體"},{"n":"敬華大飯店1975","y":1975,"a":[4],"lat":24.142602,"lng":120.68387,"d":"王文芳/王水河設計外觀","s":["《蓬萊異聞錄》／戰後建築"],"t":"敬華大飯店1975 王文芳/王水河設計外觀"},{"n":"新太陽堂餅店","y":null,"a":[4],"lat":24.139735,"lng":120.681585,"d":"王水河字體與土地公","s":["《蓬萊異聞錄》／戰後建築"],"t":"新太陽堂餅店 王水河字體與土地公"},{"n":"西北大飯店","y":null,"a":[4,78],"lat":24.14455,"lng":120.6773,"d":"西北大飯店謝碧榮建築師+王水河","s":["《蓬萊異聞錄》／戰後建築"],"t":"西北大飯店 西北大飯店謝碧榮建築師+王水河"},{"n":"鍾診所","y":null,"a":[67],"lat":23.975344,"lng":121.607293,"d":"漢光建築師事務所<br><br>漢寶德、登琨豔","s":["《台博GIS》／漢寶德","《蓬萊異聞錄》／戰後建築"],"t":"鍾診所 鍾外科診所1974 漢光建築師事務所漢寶德、登琨豔"},{"n":"聯宏九如社區1976","y":1976,"a":[50,74],"lat":22.655446,"lng":120.276018,"d":"陳昭武 蔡柏鋒 曾觀濤<br>建築師雜誌 1977/4","s":["《蓬萊異聞錄》／戰後建築"],"t":"聯宏九如社區1976 陳昭武蔡柏鋒曾觀濤建築師 定的進度快百分之五，可以提前完工。<br><br>潘敦義曾以南機場平民住宅，與香港徙置區比較。他指出：香港徙置區，每戶祇有六蓆大，每月要繳十二元港幣，而南機場平民住宅的丙種住宅，每戶十九蓆，每月僅攤還本息台幣二百元，以面積及標格比較，要比香港徙置區實惠得多。更重要的是：南機場平民住宅的居民，十年後，產權屬於自己，而香港徙置區的產權，永遠是香港政府的，這中間真有天淵之別。<br><br>有人曾認為，平民住宅的每戶的面積似乎嫌小了些。潘敦義則列舉數字證明：這一批違建住戶所住的違建房屋，面積祇有一至五坪，其中有三分之二以上為二坪半左右；新建的平民住宅，是要比他們原來的住屋，寬敞得多。同時這一批住宅十分牢固，雖祇有五層，實際相當於六層的建築，它的基礎深達三公尺。另外樓下住宅，高度較高，且可經商，使原來經商的人，仍有經商的機會。<br><br>潘敦義在簡報中并透露今後處理違建，在「先建後拆」的原則下，將計劃繼續發展衛星都市，沒有留居市區必要者，在鄰近鄉鎮興建住宅，收容市區拆除的違建戶，對於不妨害都市計劃和交通市容的違建，准就地重建；另外是設立新社區大量建築住宅，除容納拆遷之違建戶外，并擴及一般收入不多的市民，根絕新違建的發生。<br><br>潘敦義曾特別強調必須根絕新違建的發生，才能夠推行以上的計劃，否則不論有多麼完善的計劃決不會收到良好的效果。<br><br>【1964-05-23/聯合報/02版/第二版】","s":["《蓬萊異聞錄》／戰後建築"],"t":"南機場一期1964/11 利眾(林柏年)、中國興業(趙楓)、張敬德(德聯)南機場市宅定七月落成工程進行順利加快百分之五【本報訊】台北日機場平民住宅工地舉行簡報，由市府主任秘書潘敦義向各界報告有關這項建築工程的事項。南機場平民住宅是政府為了解決違章建築，在「先建後拆」的原則下所進行的一項工程，於去年十月十六日動工，預定本年七月可以落成潘敦義說：興建南機場平民住宅，是為配合執行台北地區防洪治標計劃，同時是台北違建三年整建訃劃中的第一步。其建築用地共一○一五四坪，由軍方支援撥用，及委託利眾、興業、德聯三家建築師事務所聯合設計監工。這一批新建平民住宅，是五層平頂連棟的鋼筋混凝土清水紅磚樓房，共十一大棟，依面積分為甲、乙、丙三種，每戶都有自用的廚、廁、浴等設備。甲種住宅是三○四戶，每戶一三˙九十建坪，價格因位置層別而不同，自三萬四千九百五十元至五萬一千二百八十三元，共有九類；乙種三二八戶，每戶一二˙二○建坪，價格為三萬零六百四十六元至四萬九千一百一十二元等五類；丙種六三二戶，每戶八˙六五建坪，價格為二萬四千零七十元至三萬五千三百二十一元等九類。總共是一、二六四戶。潘敦義說：興建南機場平民住宅，建築經費是由居民自籌百分之二十，省政府貸款百分之八十，月息五厘，由居民分十年按月償還。每月攤還本息約三百元。潘敦義特別指出這次興建平民住宅工程發包及進行情形，十分圓滿。這次工程是採取公開招標，祕密領圖，通信投標方式發包。底價由各有關單位核算，於投標後開標前共同議定，以避免發生圍標舞弊情事，並請由警總李副總司令及台北市長主持開標，以昭公信。至於工程進行情形，除由建築師負責監工外，並由有關單位會同居民代表組成工程組，常駐工地監工，每星期六並舉行檢討會一次，協調解決問題。由於各方面配合努力，工程進行順利，已較預定的進度快百分之五，可以提前完工。潘敦義曾以南機場平民住宅，與香港徙置區比較。他指出：香港徙置區，每戶祇有六蓆大，每月要繳十二元港幣，而南機場平民住宅的丙種住宅，每戶十九蓆，每月僅攤還本息台幣二百元，以面積及標格比較，要比香港徙置區實惠得多。更重要的是：南機場平民住宅的居民，十年後，產權屬於自己，而香港徙置區的產權，永遠是香港政府的，這中間真有天淵之別。有人曾認為，平民住宅的每戶的面積似乎嫌小了些。潘敦義則列舉數字證明：這一批違建住戶所住的違建房屋，面積祇有一至五坪，其中有三分之二以上為二坪半左右；新建的平民住宅，是要比他們原來的住屋，寬敞得多。同時這一批住宅十分牢固，雖祇有五層，實際相當於六層的建築，它的基礎深達三公尺。另外樓下住宅，高度較高，且可經商，使原來經商的人，仍有經商的機會。潘敦義在簡報中并透露今後處理違建，在「先建後拆」的原則下，將計劃繼續發展衛星都市，沒有留居市區必要者，在鄰近鄉鎮興建住宅，收容市區拆除的違建戶，對於不妨害都市計劃和交通市容的違建，准就地重建；另外是設立新社區大量建築住宅，除容納拆遷之違建戶外，并擴及一般收入不多的市民，根絕新違建的發生。潘敦義曾特別強調必須根絕新違建的發生，才能夠推行以上的計劃，否則不論有多麼完善的計劃決不會收到良好的效果。【1964-05-23/聯合報/02版/第二版】"},{"n":"功學社1982","y":1982,"a":[60],"lat":25.036545,"lng":121.543432,"d":"黃祖權","s":["《蓬萊異聞錄》／戰後建築"],"t":"功學社1982 黃祖權"},{"n":"澤惠大樓1982","y":1982,"a":[60],"lat":25.022498,"lng":121.527953,"d":"黃祖權","s":["《蓬萊異聞錄》／戰後建築"],"t":"澤惠大樓1982 黃祖權"},{"n":"管理局&活動中心1986","y":1986,"a":[1,49],"lat":24.782033,"lng":121.005897,"d":"彭蔭宣 陳其寬","s":["《台博GIS》／陳其寬","《蓬萊異聞錄》／戰後建築"],"t":"管理局&活動中心1986 管理局&活動中心1986 彭蔭宣陳其寬彭蔭宣陳其寬"},{"n":"清大原子爐1961","y":1961,"a":[40],"lat":24.789849,"lng":120.992021,"d":"張昌華<br>美援","s":["《蓬萊異聞錄》／戰後建築"],"t":"清大原子爐1961 張昌華美援"},{"n":"凍頂黃宅2000","y":2000,"a":[68],"lat":23.743222,"lng":120.764987,"d":"趙力行<br>有機建築","s":["《蓬萊異聞錄》／戰後建築"],"t":"凍頂黃宅2000 趙力行有機建築"},{"n":"高師大體育館1987","y":1987,"a":[49],"lat":22.62526,"lng":120.322335,"d":"陳其寬","s":["《台博GIS》／陳其寬","《蓬萊異聞錄》／戰後建築"],"t":"高師大體育館1987 高師大體育館1987 陳其寬陳其寬"},{"n":"國立故宮博物院1995","y":1995,"a":[8,62,72],"lat":25.102355,"lng":121.548492,"d":"潘冀 陳森藤 王秋華<br><br>潘冀 陳森藤 王秋華<br><a href=\"https://drive.google.com/drive/u/0/folders/1mFkueZGLoE-XI6sBSQZWG1alHIfb1NbA\">https://drive.google.com/drive/u/0/folders/1mFkueZGLoE-XI6sBSQZWG1alHIfb1NbA<\/a><br><br>耗資新台幣六千萬元的士林外雙溪故宮中央博物院新建工程，日前工程進行至中央大樓第四層時，約五、六坪剛灌好水泥走廊，突然坍塌，現場工人迅速躲避，幸未傷人。<br><br>據現場目擊的人說：上月廿八日下午，約在四時左右，大樓中央部份突然發生一聲巨響，當時看見很多木材碎片和水泥坍下，工人們不知究竟，紛紛走避，一時情況十分緊張，待發現沒有繼續坍塌的情形後，大家才鎮定下來。<br><br>據事後工程師調查，發現是四樓走廊下裂所致，這由三根木連結而成，從三樓的走廊有同樣的支柱十，往上支住四樓走廊剛剛灌好水泥，工人們正預備離開現場，這時中間一根支上木材與木材之間連結部份突然斷裂，以致約五、六坪剛灌好水泥的走廊，隨之坍塌。承包的營造商表示：坍塌事件發生後，他們已漏夜修復，同時立即檢查全部工程的支架，避免再有相同事件的發生。<br><br>有關當局對這個耗資六千萬元，興建後收藏國寶的博物院工程，竟然發生坍塌事件，表示非常重視，除派員調查原因外，並嚴查是否有偷工減料情形。<br><br>士林外雙溪的博物院新建工程，由公共工程局負責，盛泰營造廠承包，早在民國五十一年即開工，後因故停工一段時間，到五十二年五月因霧峰故宮博物院所藏「四庫全書薈要」漏雨受損事件發生，當局乃決定繼續興建外雙溪的故宮博物院，以便收藏國寶，於去年三月復工。<br><br>這座建築是由黃寶瑜建築師所設計，在外形上是純粹中國風格，內部則完全是近代西方的設計，全部佔地約六萬坪，共分五層，中央為大廳，四周是陳列室，左右兩邊是畫廊，陳列室有走廊可以直通後山洞的隧道，山洞內將冷藏最珍貴的國寶，並且裝有空氣調節，及防空設備，可以避免任何意外災害。<br><br>目前工程已進行到大樓的第四層，預計於今年八月間可全部竣工。<br><br>【本報訊】公共工程局台北工程處負責人說，外雙溪故宮中央博物院新建工程的坍塌部份，已漏夜趕工，於五日修復。他說，這對整個建築並無影響。但是否有偷工減料情事，仍在調查研究中。<br><br>他說，兩院新廈工程，進行尚稱順利，依照預定計劃，將於今年八月間全部竣工，如各方面配合良好，也許可能提前完成。他認為這次四樓走廊工程的坍塌，並不影響整個工程的進度。<br><br>他說，承包這項工的盛泰營造廠，此次損失四、五萬元，幸而沒有傷人。工程處已督飭營造廠注意，今後不得再有類似情形發生。<br><br>【1965-01-06/聯合報/03版/】","s":["《台博GIS》／王秋華","《蓬萊異聞錄》／戰後建築"],"t":"國立故宮博物院1995 故宮博物院圖書文獻大樓1995 潘冀陳森藤王秋華潘冀陳森藤王秋華https://drive.google.com/drive/u/0/folders/1mfkuezgloe-xi6sbsqzwg1alhifb1nba耗資新台幣六千萬元的士林外雙溪故宮中央博物院新建工程，日前工程進行至中央大樓第四層時，約五、六坪剛灌好水泥走廊，突然坍塌，現場工人迅速躲避，幸未傷人。據現場目擊的人說：上月廿八日下午，約在四時左右，大樓中央部份突然發生一聲巨響，當時看見很多木材碎片和水泥坍下，工人們不知究竟，紛紛走避，一時情況十分緊張，待發現沒有繼續坍塌的情形後，大家才鎮定下來。據事後工程師調查，發現是四樓走廊下裂所致，這由三根木連結而成，從三樓的走廊有同樣的支柱十，往上支住四樓走廊剛剛灌好水泥，工人們正預備離開現場，這時中間一根支上木材與木材之間連結部份突然斷裂，以致約五、六坪剛灌好水泥的走廊，隨之坍塌。承包的營造商表示：坍塌事件發生後，他們已漏夜修復，同時立即檢查全部工程的支架，避免再有相同事件的發生。有關當局對這個耗資六千萬元，興建後收藏國寶的博物院工程，竟然發生坍塌事件，表示非常重視，除派員調查原因外，並嚴查是否有偷工減料情形。士林外雙溪的博物院新建工程，由公共工程局負責，盛泰營造廠承包，早在民國五十一年即開工，後因故停工一段時間，到五十二年五月因霧峰故宮博物院所藏「四庫全書薈要」漏雨受損事件發生，當局乃決定繼續興建外雙溪的故宮博物院，以便收藏國寶，於去年三月復工。這座建築是由黃寶瑜建築師所設計，在外形上是純粹中國風格，內部則完全是近代西方的設計，全部佔地約六萬坪，共分五層，中央為大廳，四周是陳列室，左右兩邊是畫廊，陳列室有走廊可以直通後山洞的隧道，山洞內將冷藏最珍貴的國寶，並且裝有空氣調節，及防空設備，可以避免任何意外災害。目前工程已進行到大樓的第四層，預計於今年八月間可全部竣工。【本報訊】公共工程局台北工程處負責人說，外雙溪故宮中央博物院新建工程的坍塌部份，已漏夜趕工，於五日修復。他說，這對整個建築並無影響。但是否有偷工減料情事，仍在調查研究中。他說，兩院新廈工程，進行尚稱順利，依照預定計劃，將於今年八月間全部竣工，如各方面配合良好，也許可能提前完成。他認為這次四樓走廊工程的坍塌，並不影響整個工程的進度。他說，承包這項工的盛泰營造廠，此次損失四、五萬元，幸而沒有傷人。工程處已督飭營造廠注意，今後不得再有類似情形發生。【1965-01-06/聯合報/03版/】"},{"n":"中央研究員的美國研究中心1972","y":1972,"a":[5,8],"lat":25.03965,"lng":121.61514,"d":"王秋華、Percival Goodman<br><br>王秋華、Percival Goodman<br>王以唐/大唐（簽證）<br>吳季賢/永固營造<br>61使字第1207號<br>落水口<br>brutalism","s":["《台博GIS》／王秋華","《蓬萊異聞錄》／戰後建築"],"t":"中央研究員的美國研究中心1972 中央研究員的美國研究中心1972 王秋華、percivalgoodman王秋華、percivalgoodman王以唐/大唐（簽證）吳季賢/永固營造61使字第1207號落水口brutalism"},{"n":"中原大學圖書館1983","y":1983,"a":[8],"lat":24.958277,"lng":121.240579,"d":"王秋華","s":["《台博GIS》／王秋華","《蓬萊異聞錄》／戰後建築"],"t":"中原大學圖書館1983 中原大學圖書館1983 王秋華王秋華"},{"n":"澎湖青年活動中心1982","y":1982,"a":[67],"lat":23.56815,"lng":119.56314,"d":"漢寶德/漢光","s":["《台博GIS》／漢寶德","《蓬萊異聞錄》／戰後建築"],"t":"澎湖青年活動中心1982 澎湖青年活動中心1982 漢寶德/漢光漢寶德/漢光"},{"n":"溪頭青年活動中心1977","y":1977,"a":[67],"lat":23.67003,"lng":120.78846,"d":"漢寶德/漢光","s":["《台博GIS》／漢寶德","《蓬萊異聞錄》／戰後建築"],"t":"溪頭青年活動中心1977 溪頭青年活動中心1977 漢寶德/漢光漢寶德/漢光"},{"n 部份超高違章建案，工務局將處分這座大樓的建築包商，並報請省建設廳處罰大樓的設計師。<br><br>工務局將處分的大樓建築包商，是台北市建築公會理事長廖欽福所經營的營造廠。但是，廖欽福營造廠的工程人員昨晚說，泰安大樓的建築工程只是由他們「代辦」的，而不是完全承包。<br><br>工務局的有關官員不願說明，廖欽福營造廠將受何種處分。<br><br>工務局報請建設廳處分的泰安大樓設計師，是林慶豐。工務局的官員也拒絕說明他們報請建設廳給予林慶豐建築師何種處分。<br><br>據說：營造廠和設計師所受的處分，有吊銷執照等規定。<br><br>承建泰安大樓的廖欽福營造廠及林慶豐設計師，這次將受到處分，是由於未按工務局核定的建築藍圖施工，而林慶豐建築師明知泰安大樓不按原先的設計施工，仍不予糾正，對泰安大樓的涉嫌違建，亦應負責。<br><br>【本報訊】台北泰安大樓涉嫌超高違建，經台北市工務局吊銷建築執照並勒令停工後，正等待內政部對該大樓特准加高命令的解釋。<br><br>工務局和泰安大樓業主目前所等待的解釋，是內政部的特准加高命令，除了泰安大樓深入信陽街的前面二十五公尺外，是否還包括後面八‧五公尺的部份。<br><br>依台北市工務局的解釋，內政部的特准命令，只有前面的廿五公尺，後面的八‧五公尺仍應按工務局原先核准的設計藍圖興建。工務局原先核定的設計藍圖，後面八‧五公尺那一部份，靠信陽街的可以蓋三樓，後面蓋五樓。<br><br>如果內政部解釋，加高的核准令是包括整棟大樓，則工務局將再把建築執照發還給泰安大樓的業主，並准許復工。<br><br>泰安大樓的業主說：如果內政部這樣解釋，他們得以繼續施工，則他們將控告台北市政府，要求賠償停工期間所蒙受的重大損失。<br><br>但是，如果內政部解釋，特准命令並未包括大樓後面八‧五公尺的部份，則台北市工務局將採取強制執行的行動，拆除違建部份。<br><br>這種情況下，泰安大樓深入信陽街後面那八‧五公尺長和八‧五公尺寬的八層樓，靠信陽街的部份，將由八樓被拆為三樓，共拆除五樓之多，後面的部份，將由八樓拆成五樓，拆去三樓。<br><br>工務局的官員說：到昨天為止，他們仍未接獲內政部對這案子的解釋或指示，他們預計，內政部的解釋和指示，須兩週左右，才能由省建設廳轉下來。<br><br>【本報訊】關於台北市超高違建的處理問題，行政院表示在新辦法未公佈前，不能據以執行，行政院指出北市超高違建有：擅自增加層數者有六十五幢，超過前面道路寬度一倍半者一○七幢。<br><br>行政院在答覆立委質詢的書面資料中，有下列各點說明：<br><br>(1)建築物高度之限制，依現行建築技術規則第四條及第八條規定，一為最高不得超過三十五公尺，一為不得超過前面道路寬度之一倍半。台省府在擬議制訂中之台灣省建築管理規則暨都市計劃法台灣省施行細則，雖擬對於建築物之最高度，不再加以限制，但尚未核定公佈施行，自尚不能據以執行。<br><br>(2)台北市館前路四十三號館前大樓，申請核准建築者為六樓，嗣業主擅自增建為十一樓，其高既逾越三十五公尺之最高限度，抑亦超出前面道路寬度之一倍半。除已將超高三十五公尺以上部份予以拆除外，其相過前面道路寬度一倍半部份，將與其他類似之建築物一併處理，以昭公允。至該大樓是否安全，初係由台北市政府檢驗認為尚不妨害，復經函請成功大學教授依據規有資料核算結果亦認為尚屬安全，惟仍須再進一步探研十公尺以下之地質，以確定是否不致發生不均勻沉陷，是項工作亦將併入其他案件作通盤勘定。<br><br>(3)至館前大樓業主林錦祥檢舉台北市另有三百餘棟違建大樓，要求一併查明取締一案，經台省府建設廳會同警備總部、警務處、台北市政府等有關機關成立專案。組調查結果，確有擅自增加層數者六十五幢，超出前面道路寬度一倍半者一○七幢，因擴大建築面積而致空地不足規定者亦有多幢，以上三種情形以增加層數者較為嚴重，經統計增加一層者四十九幢，增加二層者九幢，增加三層者七幢，除了嚴究台北市政府主管人員之失職責任外，已由內政部邀同司法行政部等有關機開研商處理辦法中。","s":["《蓬萊異聞錄》／戰後建築"],"t":"泰安產物保險公司大樓1965 林慶豐泰安樓自高自大市政府要辦要罰准拆准建待內部講話政院表示還是老辦法【本報訊】台北市館前街泰安大樓涉嫌部份超高違章建案，工務局將處分這座大樓的建築包商，並報請省建設廳處罰大樓的設計師。工務局將處分的大樓建築包商，是台北市建築公會理事長廖欽福所經營的營造廠。但是，廖欽福營造廠的工程人員昨晚說，泰安大樓的建築工程只是由他們「代辦」的，而不是完全承包。工務局的有關官員不願說明，廖欽福營造廠將受何種處分。工務局報請建設廳處分的泰安大樓設計師，是林慶豐。工務局的官員也拒絕說明他們報請建設廳給予林慶豐建築師何種處分。據說：營 .com.tw/detail/?sn=ys152053&pi=1&st=-7&kw=%e5%a4%a9%e6%af%8d&si=2"},{"n":"葉公超舊宅1971","y":1971,"a":[44],"lat":25.12077,"lng":121.53743,"d":"張德霖<br>公會出版品：台灣的住宅建築<br><a href=\"https://ym-the-endless-frontier8.webnode.tw/\">https://ym-the-endless-frontier8.webnode.tw/<\/a>","s":["《蓬萊異聞錄》／戰後建築"],"t":"葉公超舊宅1971 張德霖公會出版品：台灣的住宅建築https://ym-the-endless-frontier8.webnode.tw/"},{"n":"謝昌龍宅1963","y":1963,"a":[28],"lat":25.035319,"lng":121.529773,"d":"林慶豐","s":["《蓬萊異聞錄》／戰後建築"],"t":"謝昌龍宅1963 林慶豐"},{"n":"江麗宅1983","y":1983,"a":[20],"lat":25.157765,"lng":121.501905,"d":"李祖原<br><a href=\"https://realty.com.tw/a5072/\">https://realty.com.tw/a5072/<\/a>","s":["《蓬萊異聞錄》／戰後建築"],"t":"江麗宅1983 李祖原https://realty.com.tw/a5072/"},{"n":"台北孔廟明倫堂1955","y":1955,"a":[76],"lat":25.072958,"lng":121.516222,"d":"盧毓駿<br>北方宮殿式<br><br>興建明倫堂 月底可開工<br>【本報訊】<br>考試院、教育廳、台北市政府以及本省文化教育界人士，決定於台北市大龍峒孔廟興建明倫堂，初步籌備工作，已大致就緒，並成立台北市孔廟明倫堂壽建委員會，田考試院長賈景德任主任委員，吳三連市長為副主任委員，台北市議會議長黃啟瑞為總幹事、鄧傳楷、吳石山、陳清汾、許丙等任籌備委員。<br><br>此項籌建工程，圖樣已繪就，全部有一百五十坪，將為一工程浩大，古色古香宮殿式建築，且部份以北平故宮為藍圖。經費初步估計六十萬元，除由省府，台北市府撥助大部份外，其餘將同各界勸募。約本月底可招標開工。<br><br>【1954-02-14/聯合報/03版/第三版】","s":["《蓬萊異聞錄》／戰後建築"],"t":"台北孔廟明倫堂1955 盧毓駿北方宮殿式興建明倫堂月底可開工【本報訊】考試院、教育廳、台北市政府以及本省文化教育界人士，決定於台北市大龍峒孔廟興建明倫堂，初步籌備工作，已大致就緒，並成立台北市孔廟明倫堂壽建委員會，田考試院長賈景德任主任委員，吳三連市長為副主任委員，台北市議會議長黃啟瑞為總幹事、鄧傳楷、吳石山、陳清汾、許丙等任籌備委員。此項籌建工程，圖樣已繪就，全部有一百五十坪，將為一工程浩大，古色古香宮殿式建築，且部份以北平故宮為藍圖。經費初步估計六十萬元，除由省府，台北市府撥助大部份外，其餘將同各界勸募。約本月底可招標開工。【1954-02-14/聯合報/03版/第三版】"},{"n":"梨山賓館1961","y":1961,"a":[46,63],"lat":24.254294,"lng":121.251584,"d":"楊卓成<br>許英魁/鼎華負責施工圖<br>北方宮殿式","s":["《蓬萊異聞錄》／戰後建築"],"t":"梨山賓館1961 楊卓成許英魁/鼎華負責施工圖北方宮殿式"},{"n":"文化大學大仁館1965","y":1965,"a":[76],"lat":25.137079,"lng":121.539422,"d":"盧毓駿<br>北方宮殿式","s":["《蓬萊異聞錄》／戰後建築"],"t":"文化大學大仁館1965 盧毓駿北方宮殿式"},{"n":"衛生福利部 臺南醫院1967","y":1967,"a":[63],"lat":22.996071,"lng":120.208878,"d":"北方宮殿式<br>楊卓成","s":["《蓬萊異聞錄》／戰後建築"],"t":"衛生福利部 臺南醫院1967 北方宮殿式楊卓成"},{"n":"中興塔1969","y":1969,"a":[29],"lat":22.666753,"lng":120.342824,"d":"姚元中<br>北方宮殿式","s":["《蓬萊異聞錄》／戰後建築"],"t":"中興塔1969 姚元中北方宮殿式"},{"n":"國民革命忠烈祠1969","y":1969,"a":[29],"lat":25.079411,"lng":121.532956,"d":"北方宮殿式<br>姚文英+姚元中<br><br>趕建中的圓山忠烈祠，為名建築師姚文英計，由我國營造界巨子陶桂林所經營的馥記營造廠承建。這座雄偉浩大的忠烈祠，以廡殿，清式的中國建築風格，傳統的造型，將於本年秋祭前完成，以備「九三」軍人節秋祭國殤之用。這座佔地一萬四千餘坪的中國古典建築，是仿照山東孔子廟的型式設計的，它的最前面是一座高達十六公尺的山門，氣勢宏偉，莊嚴肅穆，當你踏入山門後，就是一片寬敞的廣場，能容納三千餘人及一百部各型車輛，場內佈置有樹木，花圃，石獅子，鋼鼎，華表，及照明燈等設備。巍峨壯麗的忠烈同正殿，是一座高逾廿六公尺(約七層樓高)的偉大建築，共長五十公尺，寬卅一公尺，四週有迴廊，殿內有約一千人坐位，兩側為烈士奉祀配殿，走廊相互連接，後面闢為烈士史蹟碑走廊，另還建有辦公室、貴賓室、警衛室、鐘鼓樓、及先賢祠等，全部為鋼筋混凝土，外塗以鮮豔的宮殿彩色，屋頂為黃色的琉璃瓦，充份顯示出中國固有的建築風格。<br><br>設計這座建築物的姚文英建築師南京人，現年六十二歲，有著一段不平凡的經歷。<br><br>他說：當他十一歲時，即開始做木工及泥水工的學徒，從那時起他懷有一個遠大的抱負，立志做一個成功的建築師，因此他白天做工，晚上念書，甚至在工作中也不忘記研究學問，只要工作一停下，他馬上拿起書本埋頭自修，後來在美國萬國函授學校建築科修業期滿，所謂有志竟成，直到民國十九年，終於使他取得一個合法的建築師的資格，抗戰期間，為赴國難，毅然投筆從戎，加入空軍行列，在工程技術部門工作，從工程師、主任工程師、總工程師，到處長，在空軍度過了漫長的廿載歲月，他在服役期中，多半負責構築飛機場及飛機跑道工程。來到台灣後，開始在台北市成立石城建築師事務所，他特別強調，在台北開業十多年來，和營造商合作最為密切，感情也最融洽，因為他當過木工、泥水工、工頭、小包商，他非常了解他們的困難，他在設計時都設身處地的為他們著想，而對業主更是抱著最大的服務熱忱。石城建築師事務所設立於台北市林森北路，電話：二六○○四。<br><br>【1968-03-01/經濟日報/04版/工商服務】","s":["《蓬萊異聞錄》／戰後建築"],"t":"國民革命忠烈祠1969 北方宮殿式姚文英+姚元中趕建中的圓山忠烈祠，為名建築師姚文英計，由我國營造界巨子陶桂林所經營的馥記營造廠承建。這座雄偉浩大的忠烈祠，以廡殿，清式的中國建築風格，傳統的造型，將於本年秋祭前完成，以備「九三」軍人節秋祭國殤之用。這座佔地一萬四千餘坪的中國古典建築，是仿照山東孔子廟的型式設計的，它的最前面是一座高達十六公尺的山門，氣勢宏偉，莊嚴肅穆，當你踏入山門後，就是一片寬敞的廣場，能容納三千餘人及一百部各型車輛，場內佈置有樹木，花圃，石獅子，鋼鼎，華表，及照明燈等設備。巍峨壯麗的忠烈同正殿，是一座高逾廿六公尺(約七層樓高)的偉大建築，共長五十公尺，寬卅一公尺，四週有迴廊，殿內有約一千人坐位，兩側為烈士奉祀配殿，走廊相互連接，後面闢為烈士史蹟碑走廊，另還建有辦公室、貴賓室、警衛室、鐘鼓樓、及先賢祠等，全部為鋼筋混凝土，外塗以鮮豔的宮殿彩色，屋頂為黃色的琉璃瓦，充份顯示出中國固有的建築風格。設計這座建築物的姚文英建築師南京人，現年六十二歲，有著一段不平凡的經歷。他說：當他十一歲時，即開始做木工及泥水工的學徒，從那時起他懷有一個遠大的抱負，立志做一個成功的建築師，因此他白天做工，晚上念書，甚至在工作中也不忘記研究學問，只要工作一停下，他馬上拿起書本埋頭自修，後來在美國萬國函授學校建築科修業期滿，所謂有志竟成，直到民國十九年，終於使他取得一個合法的建築師的資格，抗戰期間，為赴國難，毅然投筆從戎，加入空軍行列，在工程技術部門工作，從工程師、主任工程師、總工程師，到處長，在空軍度過了漫長的廿載歲月，他在服役期中，多半負責構築飛機場及飛機跑道工程。來到台灣後，開始在台北市成立石城建築師事務所，他特別強調，在台北開業十多年來，和營造商合作最為密切，感情也最融洽，因為他當過木工、泥水工、工頭、小包商，他非常了解他們的困難，他在設計時都設身處地的為他們著想，而對業主更是抱著最大的服務熱忱。石城建築師事務所設立於台北市林森北路，電話：二六○○四。【1968-03-01/經濟日報/04版/工商服務】"},{"n":"鳳山區肉品市場","y":null,"a":[48],"lat":22.633624,"lng":120.3648,"d":"陳仁和","s":["《台博GIS》／陳仁和","《蓬萊異聞錄》／戰後建築"],"t":"鳳山區肉品市場 鳳山肉品市場1976 陳仁和"},{"n":"圓山綜合大樓1969","y":1969,"a":[65],"lat":25.072869,"lng":121.5237,"d":"虞曰鎮/有巢<br><br>圓山綜合大樓已於日前奠基完畢，這棟包含示範菜市場、商場、電台及辦公室的四層大樓將於明年八月底完工。<br><br>台北市府為了改善圓山一帶動物園及中山橋附近環境衛生，訂定台北圓山地區新生計劃，該計劃的第一期工程為就地整建，除將第一號公園預定地內東北端部份的道廢止，另在南側闢一十公尺寬的新巷道，以通往酒泉街外，即在動物園門口左近興建一座富於中國傳統建築類型的綜合四層大樓。<br><br>綜合大樓的底層將為商場，以收容第「號公園預定地內及中山北路四段圓山附近兩旁原有飲食攤販，其餘樓層則分別撥供市立動物園、民防指揮部及民防電台等單位辦公之用。<br><br>除四層樓外，另有一半地下層，該處將作為菜市場，場內設有洗濯室及冷藏庫，以供所有蔬菜、果品、魚肉的清潔及冷藏之用，預定這一處設備完善的菜市場開始營業後，配以妥善的管理，將可成為台北市的示範市場。<br><br>這棟將以中國傳統建築類型建築的大樓完工後，現在民防指揮部及民防電台同動物園借用的房屋將歸還動物園，作為配合整理動物園計劃之用。<br><br>據市府有關單位表示，圓山不僅為北市風景區之一，且為通往北郊外雙溪、陽明山、天母、新北投、淡水、內湖等處的要道，所有國際觀光旅客以及居留北市的外僑，甚而友邦元首暨國際貴賓訪問時，都會經常出入其地，因此該地區的美化為一首要工作，但因該區的整建工作規模大，牽涉多，因此市府決定分兩期進行，第一期的就地整建即是興工中的綜合大樓，第二期工作則為遷建。<br><br>計劃中第二號公園預定地內及中山橋北端沿北安路兩旁的違章建築，以及海軍眷舍的遷建都列為第二期工程，因此須俟綜合大樓完成後，再另訂遷建計劃實施。<br><br>【1967-12-17/聯合報/04版/】","s":["《蓬萊異聞錄》／戰後建築"],"t":"圓山綜合大樓1969 虞曰鎮/有巢圓山綜合大樓已於日前奠基完畢，這棟包含示範菜市場、商場、電台及辦公室的四層大樓將於明年八月底完工。台北市府為了改善圓山一帶動物園及中山橋附近環境衛生，訂定台北圓山地區新生計劃，該計劃的第一期工程為就地整建，除將第一號公園預定地內東北端部份的道廢止，另在南側闢一十公尺寬的新巷道，以通往酒泉街外，即在動物園門口左近興建一座富於中國傳統建築類型的綜合四層大樓。綜合大樓的底層將為商場，以收容第「號公園預定地內及中山北路四段圓山附近兩旁原有飲食攤販，其餘樓層則分別撥供市立動物園、民防指揮部及民防電台等單位辦公之用。除四層樓外，另有一半地下層，該處將作為菜市場，場內設有洗濯室及冷藏庫，以供所有蔬菜、果品、魚肉的清潔及冷藏之用，預定這一處設備完善的菜市場開始營業後，配以妥善的管理，將可成為台北市的示範市場。這棟將以中國傳統建築類型建築的大樓完工後，現在民防指揮部及民防電台同動物園借用的房屋將歸還動物園，作為配合整理動物園計劃之用。據市府有關單位表示，圓山不僅為北市風景區之一，且為通往北郊外雙溪、陽明山、天母、新北投、淡水、內湖等處的要道，所有國際觀光旅客以及居留北市的外僑，甚而友邦元首暨國際貴賓訪問時，都會經常出入其地，因此該地區的美化為一首要工作，但因該區的整建工作規模大，牽涉多，因此市府決定分兩期進行，第一期的就地整建即是興工中的綜合大樓，第二期工作則為遷建。計劃中第二號公園預定地內及中山橋北端沿北安路兩旁的違章建築，以及海軍眷舍的遷建都列為第二期工程，因此須俟綜合大樓完成後，再另訂遷建計劃實施。【1967-12-17/聯合報/04版/】"},{"n":"聯合二村1966","y":1966,"a":[22,74],"lat":25.058943,"lng":121.558592,"d":"蔡柏鋒擔任設計總監<br>美援（Robert Rusher投資，Kuhn, Loeb & Co. 投資銀行擔保）<br><br>由美國投資銀行康勞公司貸款，在台北市民生東路新社區興建國民住宅的聯和公司，定十二日在華盛頓和康勞公司簽訂貸款合約。<br><br>美國康勞公司，這次貸給聯和公司的款額為美金五百萬元，十二日簽約時，美國政府聯邦房屋局及我國台灣省政府，均將派員參加簽約儀式。<br><br>聯和公司董事長蘇鴻炎，美籍總經理羅斯，均定於十一日啟程前往華盛頓，該公司的總建築師沈祖海，則提前於三日前往美國。台灣省政府已應美國聯邦房屋局之請，派出三位代表前往華盛頓參加簽訂儀式，這三人為土地銀行副總經理歐陽銓、台灣產物保險公司總經理陽肇昌和中國房屋建築中心總經理林伏濤。<br><br>聯和公司以這些美國貸款在民生東路新社區興建的國民住宅──聯合二村，已由新中國打撈公司得標承包工程，聯和公司並依合約，於三日通知新中國打撈公司開工。依照雙方簽訂的合約，新中國打撈公司應於接獲聯和公司的通知後，五天內即行動工。<br><br>聯和公司興建聯合二村的建築執照，台北市政府預定本週內或下週一核發。<br><br>【1965-09-04/聯合報/02版/】","s":["《蓬萊異聞錄》／戰後建築"],"t":"聯合二村1966 蔡柏鋒擔任設計總監美援（robertrusher投資，kuhn,loeb&co.投資銀行擔保）由美國投資銀行康勞公司貸款，在台北市民生東路新社區興建國民住宅的聯和公司，定十二日在華盛頓和康勞公司簽訂貸款合約。美國康勞公司，這次貸給聯和公司的款額為美金五百萬元，十二日簽約時，美國政府聯邦房屋局及我國台灣省政府，均將派員參加簽約儀式。聯和公司董事長蘇鴻炎，美籍總經理羅斯，均定於十一日啟程前往華盛頓，該公司的總建築師沈祖海，則提前於三日前往美國。台灣省政府已應美國聯邦房屋局之請，派出三位代表前往華盛頓參加簽訂儀式，這三人為土地銀行副總經理歐陽銓、台灣產物保險公司總經理陽肇昌和中國房屋建築中心總經理林伏濤。聯和公司以這些美國貸款在民生東路新社區興建的國民住宅──聯合二村，已由新中國打撈公司得標承包工程，聯和公司並依合約，於三日通知新中國打撈公司開工。依照雙方簽訂的合約，新中國打撈公司應於接獲聯和公司的通知後，五天內即行動工。聯和公司興建聯合二村的建築執照，台北市政府預定本週內或下週一核發。【1965-09-04/聯合報/02版/】"},{"n":"光華大廈前後棟1970","y":1970,"a":[65],"lat":25.029477,"lng":121.526785,"d":"虞曰鎮/有巢<br>中華工程","s":["《蓬萊異聞錄》／戰後建築"],"t":"光華大廈前後棟1970 虞曰鎮/有巢中華工程"},{"n":"中央再保險大樓1968","y":1968,"a":[22,43],"lat":25.052429,"lng":121.529825,"d":"沈祖海、張肇康、紐約程觀堯（Paul C. Chen）<br><br>全部用大理石建築的中央再保險大樓，今(卅一)日正式啟用。這座外觀允稱在東南亞地區最豪華的大樓，是沈祖海建築師的傑作。<br><br>一共用了四萬尺大理石的中央再保大樓，在自五十五年六月動工，迄今年八月落成的漫長施工期間，並沒有給這位享譽國內的建築師帶來特別困擾的難題，沈祖海將順利施工歸功於業主對建築師的信心與充份合作。<br><br>沈祖海說，中央再保險大樓是國內第一棟採取合作方式興建的大廈，由各業主組成一個興建委員會，這個委員會的主任委員是中央再保險公司董事長吳幼林，兩位副主任委員是中國技術服務社董事長朱騫，與台灣紙業公司總經理吳祖坪，此一委員會決定一切有關事項，較諸一個業主處處對興建工程，經常干涉掣肘，要使施工順利得多。<br><br>中央再保險大樓的全部建築費用，包括空氣調節與電梯等設施在內，共計新台幣四千五百餘萬元，依這棟大樓的水準來說，不能算貴。<br><br>當吳幼林倡議以合作方式興建大樓，集合了各業主資金之後，沈祖海對這棟大樓的設計，為這棟大樓外表的建築材料，頗費思考。他把所有能用上的材料，均一一提出，就各項優點和缺點，逐一檢討，多少都有點不滿意，最後，國產大理石被提出來，為什麼不可以呢？<br><br>有人認為：此間出產的大理石質地太較，時間久了，可能起風化作用，這項理由立刻被否定，只要保養良好，不是灰濛濛的，自然的風化作用，反而會增加美觀，與一般建材築成的建築物迥異其趣。<br><br>中央再保險大樓使用的石料，有大理石與蛇紋石兩種，最貴的一尺要一百廿元，最便宜的要八十元，在整個施工過程中，因為蘇花公路中斷幾次，而拖延了若干時日，除此之外，可說沒有意外的困擾，尤其是施工之前，沈祖海設想週到，徵得業主的同意，先為鄰屋的牆基打下一排預壘椿，經常發生的大廈施工造成鄰屋屋基傾斜問題，就此解決。<br><br>沈祖海說，中央再保險大樓的興建，給此間建築提供了兩點新的觀念，其一是證明大理石是一種良好的建築材料，其二是合作性的大樓，可以使資金的負擔減輕，並將土地價值作了更有效的利用。","s":["《蓬萊異聞錄》／戰後建築"],"t":"中央再保險大樓1968 沈祖海、張肇康、紐約程觀堯（paulc.chen）全部用大理石建築的中央再保險大樓，今(卅一)日正式啟用。這座外觀允稱在東南亞地區最豪華的大樓，是沈祖海建築師的傑作。一共用了四萬尺大理石的中央再保大樓，在自五十五年六月動工，迄今年八月落成的漫長施工期間，並沒有給這位享譽國內的建築師帶來特別困擾的難題，沈祖海將順利施工歸功於業主對建築師的信心與充份合作。沈祖海說，中央再保險大樓是國內第一棟採取合作方式興建的大廈，由各業主組成一個興建委員會，這個委員會的主任委員是中央再保險公司董事長吳幼林，兩位副主任委員是中國技術服務社董事長朱騫，與台灣紙業公司總經理吳祖坪，此一委員會決定一切有關事項，較諸一個業主處處對興建工程，經常干涉掣肘，要使施工順利得多。中央再保險大樓的全部建築費用，包括空氣調節與電梯等設施在內，共計新台幣四千五百餘萬元，依這棟大樓的水準來說，不能算貴。當吳幼林倡議以合作方式興建大樓，集合了各業主資金之後，沈祖海對這棟大樓的設計，為這棟大樓外表的建築材料，頗費思考。他把所有能用上的材料，均一一提出，就各項優點和缺點，逐一檢討，多少都有點不滿意，最後，國產大理石被提出來，為什麼不可以呢？有人認為：此間出產的大理石質地太較，時間久了，可能起風化作用，這項理由立刻被否定，只要保養良好，不是灰濛濛的，自然的風化作用，反而會增加美觀，與一般建材築成的建築物迥異其趣。中央再保險大樓使用的石料，有大理石與蛇紋石兩種，最貴的一尺要一百廿元，最便宜的要八十元，在整個施工過程中，因為蘇花公路中斷幾次，而拖延了若干時日，除此之外，可說沒有意外的困擾，尤其是施工之前，沈祖海設想週到，徵得業主的同意，先為鄰屋的牆基打下一排預壘椿，經常發生的大廈施工造成鄰屋屋基傾斜問題，就此解決。沈祖海說，中央再保險大樓的興建，給此間建築提供了兩點新的觀念，其一是證明大理石是一種良好的建築材料，其二是合作性的大樓，可以使資金的負擔減輕，並將土地價值作了更有效的利用。"},{"n":"香檳大廈1969","y":1969,"a":[69],"lat":25.041947,"lng":121.546626,"d":"林良鴻、劉明國、李雍熙、陳健一、許紹鵬<br><br>太平洋建設公司說，他們為大眾「擇佳地，建良宅」，一批又一批的興建，該公司對建造豪華舒適的住家，已有經驗，仍在不斷的作技術與設計的改進，目前，已設計完成一座更為理想的高級住宅大廈，命名「香檳大廈」，由林良鴻建築師事務所承擔設計，並由林良鴻、劉明國、李雍熙、陳健一、許紹鵬等多位專家共同合作設計完成，將於日內正式破土興建，此大廈座落於台北市高級文化住宅社區之內，臨忠孝路，近敦化南路，與光武西村，安樂大廈，勝利大廈，敦化大廈等高級住宅相毗為鄰，靠近學校、市場、醫院，實為住家最理想的地帶。<br><br>該公司又說，「香檳大廈」是一棟高達十二層雄偉的大樓，為鋼筋混凝土結構，係經過結構力學專家精確設算，採用性能優越的「強力鋼筋」，可防颱抗震，內部格局，匠心獨具，其房間寬敞，光線充足，空氣流通及冬暖夏涼很多優點，該大廈另闢有各種車輛停放場、公用蓄水池及洗衣曬衣等工作空間。關於裝置的公用電梯，係採用三菱名牌的寬敞電梯，各戶並裝置對講叫門器，以方便親友來訪，門窗完全採用國際水準的「中華標準鋁製門窗」，牆面分別用貼磁磚、洗石子及水泥粉刷塗P．V．C．漆，室內地板一律舖設高級瀝青地磚，浴室和陽台以舖設磁磚，其廚房設備、衛生設備、電器設備與附屬供水設備等，均採用極高尚美觀鮮豔材料。該公司已開始辦理分售，地址為台北市中山北路二段九六號嘉新大樓三樓，電話：五五八三八五、五五五二一一轉三二八、三三○、三四四。<br><br>【1968-11-29/經濟日報/05版/工商服務】","s":["《蓬萊異聞錄》／戰後建築"],"t":"香檳大廈1969 林良鴻、劉明國、李雍熙、陳健一、許紹鵬太平洋建設公司說，他們為大眾「擇佳地，建良宅」，一批又一批的興建，該公司對建造豪華舒適的住家，已有經驗，仍在不斷的作技術與設計的改進，目前，已設計完成一座更為理想的高級住宅大廈，命名「香檳大廈」，由林良鴻建築師事務所承擔設計，並由林良鴻、劉明國、李雍熙、陳健一、許紹鵬等多位專家共同合作設計完成，將於日內正式破土興建，此大廈座落於台北市高級文化住宅社區之內，臨忠孝路，近敦化南路，與光武西村，安樂大廈，勝利大廈，敦化大廈等高級住宅相毗為鄰，靠近學校、市場、醫院，實為住家最理想的地帶。該公司又說，「香檳大廈」是一棟高達十二層雄偉的大樓，為鋼筋混凝土結構，係經過結構力學專家精確設算，採用性能優越的「強力鋼筋」，可防颱抗震，內部格局，匠心獨具，其房間寬敞，光線充足，空氣流通及冬暖夏涼很多優點，該大廈另闢有各種車輛停放場、公用蓄水池及洗衣曬衣等工作空間。關於裝置的公用電梯，係採用三菱名牌的寬敞電梯，各戶並裝置對講叫門器，以方便親友來訪，門窗完全採用國際水準的「中華標準鋁製門窗」，牆面分別用貼磁磚、洗石子及水泥粉刷塗p．v．c．漆，室內地板一律舖設高級瀝青地磚，浴室和陽台以舖設磁磚，其廚房設備、衛生設備、電器設備與附屬供水設備等，均採用極高尚美觀鮮豔材料。該公司已開始辦理分售，地址為台北市中山北路二段九六號嘉新大樓三樓，電話：五五八三八五、五五五二一一轉三二八、三三○、三四四   attribution:'底圖：<a href="https://maps.nlsc.gov.tw/" target="_blank" rel="noopener">內政部國土測繪中心 臺灣通用電子地圖（灰階）</a>'
}).addTo(map);
tiles.on("tileload",()=>{tilesOK=true;});
tiles.on("tileerror",()=>{ if(++tileErr>=6 && !tilesOK) fallback(); });
setTimeout(()=>{ if(!tilesOK) fallback(); },3500);

function decodeRing(str, off, scale){
  const out=[]; let px=off[0], py=off[1];
  for(let i=0;i<str.length;i+=2){
    let x=str.charCodeAt(i)-64, y=str.charCodeAt(i+1)-64;
    x=(x>>1)^(-(x&1)); y=(y>>1)^(-(y&1));
    x+=px; y+=py; px=x; py=y;
    out.push([x/scale, y/scale]);
  }
  return out;
}
const ZH={"Kaohsiung City":"高雄市","Pingtung":"屏東縣","Tainan City":"臺南市","Hsinchu City":"新竹市","Hsinchu":"新竹縣","Yilan":"宜蘭縣","Keelung City":"基隆市","Miaoli":"苗栗縣","Taipei City":"臺北市","New Taipei City":"新北市","Taoyuan":"桃園市","Changhua":"彰化縣","Chiayi":"嘉義縣","Chiayi City":"嘉義市","Hualien":"花蓮縣","Nantou":"南投縣","Taichung City":"臺中市","Yunlin":"雲林縣","Taitung":"臺東縣","Penghu":"澎湖縣","Kinmen":"金門縣","Lienchiang":"連江縣"};
function fallback(){
  if (fellBack) return; fellBack=true;
  map.removeLayer(tiles);
  map.getContainer().style.background="#000";
  const n=$("#basenote"); n.hidden=false;
  n.textContent="目前環境無法載入線上街道底圖，暫以簡化縣市輪廓顯示；部署到一般網站時會自動顯示含道路名稱的街道底圖。";
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/province/taiwan.js";
  s.onload=()=>{
    const g=window.__twGeo; if(!g) return;
    const scale=g.UTF8Scale||1024, feats=[];
    g.features.forEach(f=>{
      const en=f.properties.name_en; if(!ZH[en]) return;
      const geom=f.geometry; let coords;
      if (geom.type==="Polygon") coords=[geom.coordinates.map((r,i)=>decodeRing(r,geom.encodeOffsets[i],scale))];
      else coords=geom.coordinates.map((poly,j)=>poly.map((r,i)=>decodeRing(r,geom.encodeOffsets[j][i],scale)));
      feats.push({type:"Feature",properties:{zh:ZH[en]},geometry:{type:"MultiPolygon",coordinates:coords}});
    });
    const pane=map.createPane("base"); pane.style.zIndex=250;
    L.geoJSON({type:"FeatureCollection",features:feats},{pane:"base",interactive:false,
      style:{color:"rgba(180,190,190,.45)",weight:1,fillColor:"#0b0c0c",fillOpacity:1}}).addTo(map);
    const lp=map.createPane("baselabel"); lp.style.zIndex=260; lp.style.pointerEvents="none";
    feats.forEach(f=>{
      let best=null,area=-1;
      f.geometry.coordinates.forEach(p=>{const r=p[0];let a=0;for(let i=0;i<r.length;i++){const[x1,y1]=r[i],[x2,y2]=r[(i+1)%r.length];a+=x1*y2-x2*y1;} a=Math.abs(a); if(a>area){area=a;best=r;}});
      let cx=0,cy=0; best.forEach(([x,y])=>{cx+=x;cy+=y;}); cx/=best.length; cy/=best.length;
      L.marker([cy,cx],{pane:"baselabel",interactive:false,icon:L.divIcon({className:"",html:'<div class="county-label" style="transform:translate(-50%,-50%)">'+f.properties.zh+'</div>',iconSize:[0,0]})}).addTo(map);
    });
  };
  document.head.appendChild(s);
}

/* markers */
const renderer = L.canvas({padding:.4});
const layer = L.layerGroup().addTo(map);
const markers = B.map(b=>{
  const m=L.circleMarker([b.lat,b.lng],{renderer,radius:5.5,weight:1.2,color:"#000",fillOpacity:.95,fillColor:"#888"});
  m.bindTooltip(esc(b.n),{direction:"top",offset:[0,-6],className:"tip",opacity:1});
  m.on("click",()=>openPopup(b,true));
  return m;
});
function popupHTML(b){
  const chips=b.a.map(k=>`<span class="chip" data-k="${k}" style="--c:${COLORS[k]}">${esc(ARCH[k])}</span>`).join("");
  return `<div class="pp"><div class="pp-top"><div class="pp-yr">${b.y?b.y:"年代未詳"}</div><h3>${esc(b.n)}</h3><div class="pp-arch">${chips}</div></div>`+
    (b.d?`<div class="pp-body">${b.d}</div>`:"")+
    `<div class="pp-src">來源：${b.s.map(esc).join("；")}<br><span class="pp-coord">${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}</span></div>`+
    `<a class="pp-gmap" href="https://www.google.com/maps/search/?api=1&amp;query=${b.lat},${b.lng}" target="_blank" rel="noopener">在 Google Maps 開啟 ↗</a></div>`;
}
function openPopup(b, fly){
  const go=()=>{
    const p=L.popup({maxWidth:400,minWidth:280,autoPanPadding:[30,30],closeButton:true}).setLatLng([b.lat,b.lng]).setContent(popupHTML(b)).openOn(map);
    const el=p.getElement();
    el.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener";});
    el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ toggle(+c.dataset.k,true); }));
  };
  map.closePopup();
  dive([b.lat,b.lng], go);
  if (window.innerWidth<=820) document.body.classList.remove("side-open");
}

/* ---------- dive-in zoom ---------- */
const DIVE_ZOOM = 17;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let diveToken = 0;
function dive(latlng, done){
  const token = ++diveToken;
  const target = Math.max(DIVE_ZOOM, map.getZoom());
  const here = map.getCenter(), dz = target - map.getZoom();
  const far = map.distance(here, latlng);
  if (dz < 0.5 && far < 30){ done(); return; }            // already there
  const dur = reduceMotion ? 0.4 : 1;                       // always lands in one second
  let finished = false;
  const finish = () => { if (finished || token !== diveToken) return; finished = true; done(); };
  map.once("moveend", finish);
  map.flyTo(latlng, target, {duration: dur, easeLinearity: 0.12});
  setTimeout(finish, dur * 1000 + 400);                    // safety net
}
/* ---------- sidebar ---------- */
const archList=$("#archList");
const rows = ARCH.map((name,k)=>{
  const el=document.createElement("div"); el.className="arch"; el.style.setProperty("--c",COLORS[k]);
  el.innerHTML=`<div class="arch-row" role="button" tabindex="0" aria-pressed="false"><span class="chk"></span><span class="arch-name">${esc(name)}<span class="cnt">（${byArch[k].length}）</span></span><span class="badge" hidden></span><button class="tog" aria-label="展開作品列表"></button></div><ul class="works"></ul>`;
  const row=el.firstChild, tog=el.querySelector(".tog");
  row.addEventListener("click",e=>{ if(e.target.closest(".tog")) return; toggle(k); });
  row.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(k);} });
  tog.addEventListener("click",e=>{ e.stopPropagation(); el.classList.toggle("open"); if(el.classList.contains("open")) renderWorks(k); });
  archList.appendChild(el); return el;
});
$("#layCnt").textContent = ARCH.length+" 位";

function workLI(b,k,withDot){
  const li=document.createElement("li"); li.className="work";
  li.innerHTML=(withDot?`<span class="dot" style="--c:${COLORS[k]}"></span>`:"")+`<span class="yr">${b.y||"—"}</span><span>${esc(b.n)}</span>`;
  li.addEventListener("click",()=>openPopup(b,true));
  return li;
}
function renderWorks(k){
  const ul=rows[k].querySelector(".works"); ul.innerHTML="";
  const list = tokens.length ? byArch[k].filter(matches) : byArch[k];
  if (!list.length){ ul.innerHTML='<li class="more">沒有符合搜尋的作品</li>'; return; }
  const frag=document.createDocumentFragment(); list.forEach(b=>frag.appendChild(workLI(b,k,false))); ul.appendChild(frag);
}
function toggle(k, scrollTo){
  const i=selected.indexOf(k);
  if (i>=0) selected.splice(i,1); else selected.push(k);
  update(true);
  if (scrollTo && i<0) rows[k].scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* ---------- update ---------- */
let fitTimer=null;
function update(fit){
  const vis=[];
  B.forEach((b,i)=>{
    const show = inLayers(b) && matches(b);
    const m=markers[i];
    if (show){ m.setStyle({fillColor:COLORS[colorIdx(b)]}); if(!layer.hasLayer(m)) layer.addLayer(m); vis.push(b); }
    else if (layer.hasLayer(m)) layer.removeLayer(m);
  });
  $("#num").innerHTML = fmt(vis.length)+"<small>處建物"+(vis.length!==B.length?" / 共 "+fmt(B.length):"")+"</small>";
  $("#clr").hidden = !(selected.length || tokens.length);

  rows.forEach((el,k)=>{
    const on=isSel(k); el.classList.toggle("on",on); el.firstChild.setAttribute("aria-pressed",on);
    const badge=el.querySelector(".badge");
    if (tokens.length){ const c=byArch[k].filter(matches).length; badge.hidden=!c; badge.textContent="符合 "+c; el.classList.toggle("dim",!c); }
    else { badge.hidden=true; el.classList.remove("dim"); }
    if (el.classList.contains("open")) renderWorks(k);
  });

  const res=$("#results");
  if (tokens.length){
    res.hidden=false;
    const list=vis.slice().sort(sortWorks);
    $("#resCnt").textContent=fmt(list.length)+" 筆";
    const ul=$("#resList"); ul.innerHTML="";
    const frag=document.createDocumentFragment();
    if (selected.length){
      const li=document.createElement("li"); li.className="more";
      li.innerHTML='僅顯示已勾選的 '+selected.length+' 位建築師中符合者。<a href="#" style="color:#141414;font-weight:700">改為搜尋全部</a>';
      li.querySelector("a").addEventListener("click",e=>{e.preventDefault(); selected.length=0; update(true);});
      frag.appendChild(li);
    }
    list.slice(0,400).forEach(b=>frag.appendChild(workLI(b,colorIdx(b),true)));
    if (list.length>400){ const li=document.createElement("li"); li.className="more"; li.textContent="僅列出前 400 筆，請加入更多關鍵字縮小範圍。"; frag.appendChild(li); }
    if (!list.length){ const li=document.createElement("li"); li.className="more"; li.textContent="沒有符合的點位。"; frag.appendChild(li); }
    ul.appendChild(frag);
  } else res.hidden=true;

  if (fit){
    clearTimeout(fitTimer);
    fitTimer=setTimeout(()=>{
      if (!vis.length) return;
      if (!selected.length && !tokens.length){ map.flyTo([23.75,120.95],8,{duration:.8}); return; }
      const bb=L.latLngBounds(vis.map(b=>[b.lat,b.lng]));
      map.flyToBounds(bb,{padding:[60,60],maxZoom:16,duration:.8});
    },120);
  }
}

/* search */
const q=$("#q"), sbox=$("#sbox");
let qTimer=null, composing=false;
function runSearch(){
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{
    const nt=q.value.trim().toLowerCase().split(/[\s　,，、]+/).filter(Boolean);
    if (nt.join(" ")===tokens.join(" ")) return;
    if (nt.length) selected.length=0;   // a new search always covers all architects
    tokens=nt; update(true);
  },200);
}
q.addEventListener("compositionstart",()=>{ composing=true; });
q.addEventListener("compositionend",()=>{ composing=false; runSearch(); });
q.addEventListener("input",e=>{
  sbox.classList.toggle("has",!!q.value);
  if (composing || e.isComposing) return;
  runSearch();
});
q.addEventListener("keydown",e=>{ if(e.key==="Escape"){ q.value=""; q.dispatchEvent(new Event("input")); }});
$("#qx").addEventListener("click",()=>{ q.value=""; q.dispatchEvent(new Event("input")); q.focus(); });
$("#clr").addEventListener("click",()=>{ selected.length=0; q.value=""; sbox.classList.remove("has"); tokens=[]; update(true); });
$("#menuBtn").addEventListener("click",()=>document.body.classList.toggle("side-open"));
map.on("click",()=>document.body.classList.remove("side-open"));

update(false);
})();
</script>
