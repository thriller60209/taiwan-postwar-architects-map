<!-- Standalone shell. The map itself is the dist/wooo-map module, the same one the
     atelier WooO website mounts at /archive/map. Edit the map in src/wooo-map/. -->
<style>
@font-face{font-family:"Cascadia Mono";src:url("assets/fonts/CascadiaMono.woff2") format("woff2");font-weight:200 700;font-display:block}
@font-face{font-family:"Fusion Pixel ZHTW";src:url("assets/fonts/FusionPixel12-ZHTW.woff2") format("woff2");font-weight:400;font-display:block}
:root{--font-mono:"Cascadia Mono","Fusion Pixel ZHTW","MingLiU","PMingLiU","新細明體",monospace;--silver:#b4bebe;--silver-title:#d0d8d8;--silver-muted:#7f8888;--rule:rgba(180,190,190,.5);--cursor-x:-100vw;--cursor-y:-100vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#000;color:var(--silver)}
body{font-family:var(--font-mono);font-variant-ligatures:none;font-size:10pt;letter-spacing:0;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}a:hover,a:focus-visible{text-decoration:underline}
.site-header{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start;margin:0 18px;padding:calc(14px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;line-height:1.2}
.brand img{width:58px;height:auto;display:block;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:14px;line-height:1.2}
.nav a[aria-current="page"]{text-decoration:underline}
.map-slot{flex:1;min-height:0;margin:0 18px}
.site-footer{flex:none;display:flex;justify-content:center;gap:18px;padding:6px 18px calc(6px + env(safe-area-inset-bottom));font-size:8pt;line-height:1.4;color:var(--silver)}
.site-footer span{color:var(--silver-muted)}
.index-cursor{position:fixed;z-index:3000;pointer-events:none;opacity:0;transition:opacity .14s}
.index-cursor-x{left:0;right:0;top:var(--cursor-y);height:2px;background:rgba(180,190,190,.46)}
.index-cursor-y{top:0;bottom:0;left:var(--cursor-x);width:2px;background:rgba(180,190,190,.42)}
@media (hover:hover) and (pointer:fine){body,body *{cursor:none!important}body:hover .index-cursor{opacity:1}}
@media (max-width:760px){
  .site-header{margin:0 14px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;gap:12px;align-items:center}
  .brand img{width:40px}.brand .en{display:none}
  .nav{gap:10px}
  .map-slot{margin:0}
  .site-footer{display:none}
}
@media (max-width:400px){.brand span{display:none}}
</style>
</head>
<body>
<div class="index-cursor index-cursor-x" aria-hidden="true"></div><div class="index-cursor index-cursor-y" aria-hidden="true"></div>
<header class="site-header">
  <a class="brand" href="https://atelierwooo.vercel.app/"><img src="assets/wooo-logo-silver.png" alt="atelier WooO"><span>臺灣戰後建築師地圖<span class="en"><br>taiwan post-war architects map</span></span></a>
  <nav class="nav" aria-label="primary"><a href="https://atelierwooo.vercel.app/">index</a><a href="https://atelierwooo.vercel.app/axis">axis</a><a href="https://atelierwooo.vercel.app/archive" aria-current="page">archive</a><a href="https://atelierwooo.vercel.app/about">about</a></nav>
</header>
<main class="map-slot" id="map-slot"></main>
<footer class="site-footer"><a href="mailto:atelierwooop@gmail.com"><span>E</span> atelierwooop@gmail.com</a><a href="https://www.instagram.com/atelier_woo0/" target="_blank" rel="noopener"><span>I</span> @atelier_woo0</a></footer>
<script>
document.addEventListener("pointermove",e=>{const r=document.documentElement.style;r.setProperty("--cursor-x",e.clientX+"px");r.setProperty("--cursor-y",e.clientY+"px");},{passive:true});
</script>
<script type="module">
import { mountWoooMap } from "./dist/wooo-map/wooo-map.js?v=1cd9c8f3a9";
mountWoooMap(document.getElementById("map-slot"), {
  architectsUrl: "data/architects.json?v=c6f137e362",
  buildingsUrl: "data/buildings.json?v=c6f137e362",
  initialView: "taiwan",
  mobileBreakpoint: 760
});
</script>
</body>
</html>
