name: Sync from Google My Maps

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (UTC)
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    paths:
      - "scripts/**"
      - "sources/**"
      - ".github/workflows/sync-mymaps.yml"

permissions:
  contents: write

concurrency:
  group: sync-mymaps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the Google My Maps
        run: |
          mkdir -p sources/live
          for MID in \
            1YdXsuuZrWFRGo5Qb1JtVM8GOE7hDbYOg \
            1CxzQotAsFwOGYpLER5Eh4c819X0Pesg \
            1GWoYz00KerCWwC3BmzFpgphp0d-pBmS_ \
            1OiskSInjoV4UarGBrfSjNc5zfyGjE87T \
            1HYvRvmb2PvOoavrkxOfVX6DdrLaaWw84 \
            1XsB6fqBk73VHqtTgQpKNRWu3kUYVINKW ; do
            if curl -fsSL --retry 3 -o /tmp/map.kml "https://www.google.com/maps/d/kml?mid=${MID}&forcekml=1" \
               && grep -q "<kml" /tmp/map.kml && grep -q "<Placemark" /tmp/map.kml; then
              cp /tmp/map.kml "sources/live/${MID}.kml"
              echo "OK   ${MID}"
            else
              echo "SKIP ${MID} (download failed or not KML) - keeping previous copy"
            fi
          done

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit if anything changed
        run: |
          git config user.name "thriller60209"
          git config user.email "thriller60209@users.noreply.github.com"
          git add -A index.html data sources
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync from Google My Maps"
            git push
          fi
